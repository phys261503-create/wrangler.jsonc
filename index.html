<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>anonymous@seed: ~</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; color: #c8c8c8;
    font: 16px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  #term { height: 100%; overflow-y: auto; padding: 10px 12px; box-sizing: border-box; cursor: text; }
  #log div, #row { white-space: pre-wrap; word-break: break-all; }
  .dim { color: #7a7a7a; }
  #row { display: flex; color: #fff; }
  #prompt { white-space: pre; }
  #in { flex: 1; min-width: 0; padding: 0; margin: 0; background: transparent; border: 0; outline: 0;
    color: inherit; font: inherit; caret-shape: block; }
</style>
</head>
<body>
<div id="term">
  <div id="log"></div>
  <div id="row"><span id="prompt">seed: </span><input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus></div>
</div>
<script>
const PALETTE = ['#ff5f5f','#ffaf5f','#ffff5f','#5fff5f','#5fffff','#5f87ff','#ff5fff','#af5fff','#ffaf00','#87ff5f','#5fd7ff','#ff87d7'];
const NAMES = ['red','orange','yellow','green','cyan','blue','magenta','purple','amber','lime','sky','pink'];
const ps1 = (c) => `anonymous/${NAMES[c % NAMES.length]}@seed:~$ `;
const term = document.getElementById('term');
const log = document.getElementById('log');
const row = document.getElementById('row');
const input = document.getElementById('in');
const prompt_ = document.getElementById('prompt');
let ws = null, inRoom = false, busy = false, denied = false, pinger = null, myColor = null;

function line(text, color) {
  const d = document.createElement('div');
  if (color == null) d.className = 'dim';
  else d.style.color = PALETTE[color % PALETTE.length];
  d.textContent = text; // textContent: no HTML injection
  log.appendChild(d);
  term.scrollTop = term.scrollHeight;
}

function setPrompt(text) {
  prompt_.textContent = text;
}

const normalize = (s) => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function connect(seed) {
  busy = true; denied = false;
  // the seed never leaves this page: only its hash is sent
  const query = seed ? 'room=' + (await sha256(normalize(seed))) : 'create=1';
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?${query}`);
  ws.onopen = () => { pinger = setInterval(() => ws && ws.readyState === 1 && ws.send('ping'), 30000); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; } // 'pong'
    if (m.t === 'denied') { denied = true; line('Permission denied.'); }
    else if (m.t === 'created' || m.t === 'joined') {
      inRoom = true;
      myColor = m.color;
      if (m.t === 'created') { line('new room. share this seed:'); line('  ' + m.seed, m.color); }
      line(`connected. ${m.count} online.`);
      setPrompt(ps1(m.color));
    }
    else if (m.t === 'sys') line(`[${m.text} · ${m.count} online]`);
    else if (m.t === 'msg') line(ps1(m.color) + m.text, m.color);
  };
  ws.onclose = () => {
    clearInterval(pinger);
    if (inRoom) line('Connection closed.'); else if (!denied) line('Connection failed.');
    inRoom = false; busy = false; ws = null; setPrompt('seed: ');
  };
}

line('seed chat — enter a seed to join, or press Enter to create a room');

term.addEventListener('click', () => { if (!String(getSelection())) input.focus(); });
// Ctrl+C leaves the room, like interrupting a program (still copies when text is selected)
document.addEventListener('keydown', (e) => {
  if (!e.ctrlKey || e.code !== 'KeyC' || e.shiftKey || e.altKey || e.metaKey) return;
  if (String(getSelection()) || input.selectionStart !== input.selectionEnd) return;
  e.preventDefault();
  line((inRoom ? ps1(myColor) : 'seed: ') + input.value + '^C', inRoom ? myColor : null);
  input.value = '';
  if (ws) ws.close();
});

input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const text = input.value.trim();
  input.value = '';
  if (inRoom && ws) { if (text) ws.send(JSON.stringify({ t: 'msg', text })); return; }
  if (busy) return; // waiting for server answer
  line('seed: ' + text.replace(/./g, '*'));
  connect(text);
});
</script>
</body>
</html>
